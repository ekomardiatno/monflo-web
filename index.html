<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Track your money flow with ease" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monflo" />
    <title>Monflo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      body { background-color: #f8fafc; }
      @media (prefers-color-scheme: dark) {
        body { background-color: #020617; }
      }
    </style>
    <script>
      (function () {
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var c = d ? '#020617' : '#f8fafc';
        var m = {
          name: 'Monflo',
          short_name: 'Monflo',
          description: 'Track your money flow with ease',
          theme_color: c,
          background_color: c,
          display: 'standalone',
          start_url: './',
          scope: './',
          icons: [
            { src: 'pwa-192x192.png', sizes: '192x192', type: 'image/png' },
            { src: 'pwa-512x512.png', sizes: '512x512', type: 'image/png' },
            { src: 'pwa-192x192-maskable.png', sizes: '192x192', type: 'image/png', purpose: 'maskable' },
            { src: 'pwa-512x512-maskable.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
          ]
        };
        var b = new Blob([JSON.stringify(m)], { type: 'application/json' });
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = URL.createObjectURL(b);
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
